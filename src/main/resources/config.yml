# ---------------------------------------------------------------
#  SkyRealms
# ---------------------------------------------------------------

# Don't change: used to update older configs.
config-version: 3

worlds:
  # Created automatically as an empty void world if it doesn't exist.
  sky: skyrealms_sky
  # Your normal survival world players fall down into.
  overworld: world

islands:
  # Distance between island centres in the sky world. Must be bigger than the
  # largest footprint (continental = 512). Overworld landings sit "under" these
  # same X/Z coordinates, so this also spreads islands apart on the ground.
  spacing: 2048
  # Sea level for new islands: all ocean, shore and swamp water sits at exactly this Y.
  # Land rises above it, ocean floors and the rocky undersides hang below it.
  # 140 keeps land below the clouds (about Y 192). Each island remembers the height it was
  # built at, so changing this only affects islands bought afterwards.
  base-y: 140
  # Random up/down jitter (blocks) for each attached piece, for a natural look.
  piece-y-jitter: 3
  # Blocks placed per server tick while pasting. Lower = less lag, slower paste.
  blocks-per-tick: 20000

# Built-in generated terrain (works out of the box, no setup).
terrain:
  # Size range of each round chunk of land an island grows by (radius in blocks).
  blob-radius-min: 11
  blob-radius-max: 18

# footprint  = width/length of the buildable square, in blocks
# price      = cost to buy at this tier (upgrades cost the difference)
# start-pieces = how many biome pieces you get when buying outright (upgrading adds none:
#                upgrades only raise the border and max-pieces)
# max-pieces = how far the island can grow at this tier
tiers:
  SMALL:       { footprint: 32,  price: 5000,    start-pieces: 1,  max-pieces: 3 }
  MEDIUM:      { footprint: 64,  price: 20000,   start-pieces: 3,  max-pieces: 10 }
  LARGE:       { footprint: 128, price: 75000,   start-pieces: 8,  max-pieces: 30 }
  EXTRA_LARGE: { footprint: 256, price: 250000,  start-pieces: 20, max-pieces: 90 }
  CONTINENTAL: { footprint: 512, price: 1000000, start-pieces: 50, max-pieces: 300 }

prices:
  # Cost of attaching one extra piece of a biome you already own.
  grow-piece: 1000
  # Cost of unlocking a new biome. Unlocking adds no land: players then use Grow Land.
  biome-unlock-default: 10000
  # Cost of converting the rock under an island's existing land to another underside style.
  restyle-underside: 2500
  # Percent of the island's tier price given back when it's deleted (0 = nothing).
  delete-refund-percent: 0
  # Per-biome unlock prices (built-in ids, or custom captured folder names).
  biome-unlock:
    beach: 5000
    shallow_ocean: 8000
    cherry_grove: 25000
    deep_ocean: 20000
    badlands: 20000
    snowy: 15000
    mushroom: 25000
    lush_caverns: 25000
    volcanic: 40000
    crystal: 40000
    ancient: 40000

# Sphere sizes for /skylandadmin capture and preview (radius in blocks).
# A Small island is 32 wide, so its first piece must be "medium" or smaller.
capture-sizes:
  small: 10     # 21 blocks wide
  medium: 14    # 29 blocks wide
  large: 20     # 41 blocks wide
  huge: 28      # 57 blocks wide

# Icons shown in the chest menus, per biome folder. Unlisted biomes get a sensible guess.
# Built-in biomes already have icons; this is for custom captured biomes.
biome-icons:
  mushroom_fields: RED_MUSHROOM

# "Return to Island" and /ihome: a gust lifts you (and keeps lifting), then the wind carries you home
# while you're still rising.
return:
  # Upward speed of the gust in blocks per tick (2.2 rises about 40 blocks in a second).
  launch-power: 2.2
  # Ticks in the air before arriving home (20 ticks = 1 second).
  launch-ticks: 20

# Hotbar shortcuts: an enchanted book (opens the Skyland menu) and an enchanted feather (Return to
# Island) locked into the hotbar, so players never need a command. They can't be dropped, thrown,
# moved, stored or lost on death. Each player turns them on or off in the /skyland menu.
hotbar:
  enabled: true
  # Who has them until they choose for themselves: bedrock (Bedrock players only), all, or none.
  default: bedrock
  # Hotbar slots, 1-9.
  menu-slot: 9
  home-slot: 8

# How players pay: "vault" (money from any Vault economy plugin) or "item" (a physical item).
economy:
  currency: vault
  # Vault mode: without an economy plugin everything is free, unless this is true.
  require-vault: false
  # Item mode: prices above are converted to items. With value 1000, a 5,000 price costs 5 items.
  item:
    material: DIAMOND
    value: 1000
    # Optional: only accept items with this exact display name (for custom tokens).
    name: ""
    # Optional: how the currency is shown in menus. Defaults to the item's name.
    singular: ""
    plural: ""

# Bedrock players (via Geyser + Floodgate) get native Bedrock forms instead of chest menus.
# Needs Floodgate installed; without it everyone uses chest menus.
bedrock:
  forms: true
  # Show small vanilla icons on form buttons.
  button-icons: true

# Cosmetics (unlock levels are in levels.yml under cosmetic-levels).
cosmetics:
  name-max-length: 24
  # Island names containing any of these (case-insensitive) are refused.
  banned-words: []

# Auto-prune: islands whose owner and co-owners have all been offline this long are archived
# and removed from the world. The owner (or an admin) can restore them within restore-days.
prune:
  enabled: true
  inactive-days: 30
  restore-days: 14
  check-every-hours: 6

transit:
  # Falling below this Y in the sky world sends you down to the overworld. Keep it well
  # under the island undersides (they can hang 120+ blocks below sea level) so players can
  # explore beneath their islands. The sky world's floor is Y -64.
  depart-y: -40
  # Y you appear at above the overworld.
  arrive-y: 310
  # Landing is a random spot up to this many blocks from directly-below.
  max-landing-offset: 200
  # >1 favours landings closer to directly-below; 1 = evenly spread.
  landing-closeness-bias: 1.6
  # Re-roll landing spots that are lava, fire, cactus, etc.
  reroll-unsafe-landings: 8
  # Minimum downward speed applied on arrival so you don't "hover".
  min-arrive-speed: 1.0
  # Seconds the one-time landing protection lasts before it expires.
  protection-seconds: 90
  # Seconds between "Return to Island" uses (0 = no cooldown).
  home-cooldown: 10

# Overworld decay: players' presence slowly corrupts the chunks around them, ending in bedrock.
# Skylands are never affected. See docs/DECAY_SPEC.md.
decay:
  # Off by default. It also refuses to run on the server's main world (that world can never be
  # recycled), so point it at a dedicated resource world, or set allow-main-world for testing.
  enabled: false
  allow-main-world: false
  # World to corrupt. Defaults to worlds.overworld.
  # world: skyrealms_overworld
  ignore-creative: true
  particles: true
  action-bar: true
  # Decay added per second to the chunk an active (recently moved) player stands in.
  gain-per-second: 0.03
  # At 100 decay the gain is multiplied by (1 + ramp). Makes decay accelerate.
  ramp: 2.0
  # Share of that gain spilling into the 8 surrounding chunks, and the most it can reach there.
  neighbor-fraction: 0.25
  neighbor-cap: 50
  # Decay a chunk loses per second when nobody is near it.
  heal-per-second: 0.01
  # Chunks above leak-threshold slowly push decay into loaded neighbours, up to leak-cap.
  leak-threshold: 60
  leak-per-second: 0.004
  leak-cap: 30
  # Decay values where each stage begins.
  stages:
    decayed: 25   # grass -> coarse dirt, foliage dies, growth stops
    blighted: 50  # stone -> blackstone, logs vanish
    barren: 75    # surface becomes bedrock (permanent until the world is recycled)
  # Block-change attempts per second in a chunk at 100 decay (scales with decay).
  attempts-per-second-max: 20
  # Hard cap on attempts per tick across the whole world, so conversion can never lag the server.
  max-attempts-per-tick: 200
  # How many layers deep the bedrock crust goes.
  bedrock-depth: 24
  # Blocks within this many blocks of a player are never converted.
  safe-radius: 3
  # A player who hasn't moved for this long stops adding decay.
  afk-seconds: 60
  min-move: 0.5

# Weekly overworld recycle: the overworld players fall into becomes a managed world named
# <base-name>_<cycle>. Every interval, everyone in it is sent back to their island, a fresh world
# with a new seed replaces it, and the old one is deleted. When on, this world replaces
# worlds.overworld and decay.world. Only worlds this plugin created are ever deleted.
recycle:
  enabled: false
  base-name: skyrealms_overworld
  interval-days: 7
  # Seconds before a recycle when everyone is warned.
  warnings: [600, 300, 60, 30, 10]
  # Commands players can't use in the recycled world (their targets would vanish on recycle).
  blocked-commands: [sethome, esethome, createhome, setwarp]
  messages:
    warning: "<red>The overworld will be recycled in <white>{time}</white> to contain the corruption. Get to your island!"
    start: "<red>Recycling the overworld to contain the corruption..."
    done: "<green>The corruption is contained. A fresh overworld waits below the islands."
    evacuated: "<gray>The winds carried you home before the overworld was recycled."
    blocked: "<red>You can't do that down here. The overworld is recycled every week to contain the corruption."
# Cleansing Tonic: while it lasts, the drinker causes no decay. Only available while decay runs.
# Players buy with /skyland tonic buy <1-3>; admins give with /skylandadmin tonic give.
tonic:
  levels:
    1:
      seconds: 60          # capped at 180
      price: 500
      required-level: 1    # island level needed to buy (1 = anyone)
    2:
      seconds: 120
      price: 1500
      required-level: 10
    3:
      seconds: 180
      price: 4000
      required-level: 25
# Warded gear: helmet, chestplate, leggings and boots can carry a Warded level (I-III) that cuts
# the decay its wearer causes. Players upgrade the piece in their hand with /skyland ward upgrade.
ward:
  # Share of decay removed per worn piece, by Warded level. Four level-3 pieces = 0.80.
  reduction:
    1: 0.05
    2: 0.10
    3: 0.20
  # Most a full set can remove, whatever the pieces add up to.
  max-reduction: 0.80
  # Cost of upgrading a piece TO each level (Vault money, or item currency).
  price:
    1: 2500
    2: 7500
    3: 20000
  # Island level needed to buy each level (0 = no requirement).
  required-island-level:
    1: 5
    2: 15
    3: 30
