name: SkyRealms
version: '${version}'
main: dev.skyrealms.SkyRealmsPlugin
api-version: '26.3'
description: Buyable floating islands that grow outward, with a fall-to-overworld transit.
softdepend: [Vault, Multiverse-Core]
commands:
  realm:
    description: Manage your sky realm.
    aliases: [sr, island]
  realmadmin:
    description: SkyRealms admin tools.
    aliases: [sra]
    permission: skyrealms.admin
permissions:
  skyrealms.use:
    default: true
  skyrealms.admin:
    default: op
  skyrealms.admin.bypass:
    description: Build on any island.
    default: op
